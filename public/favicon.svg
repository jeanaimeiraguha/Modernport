<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#141420"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Subtle border -->
  <rect width="64" height="64" rx="14" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Accent corner arc top-right -->
  <path d="M 50 2 A 12 12 0 0 1 62 14" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

  <!-- "J" letter -->
  <text
    x="11"
    y="44"
    font-family="'Syne', 'Arial Black', sans-serif"
    font-weight="800"
    font-size="30"
    fill="url(#accent)"
    letter-spacing="-1"
  >J</text>

  <!-- "A" letter -->
  <text
    x="31"
    y="44"
    font-family="'Syne', 'Arial Black', sans-serif"
    font-weight="800"
    font-size="30"
    fill="#ffffff"
    letter-spacing="-1"
  >A</text>

  <!-- Dot accent -->
  <circle cx="56" cy="46" r="3.5" fill="url(#accent)" opacity="0.9"/>
</svg>
